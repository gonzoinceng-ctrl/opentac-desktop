# electron-builder configuration — see docs/brief/03-ARCHITECTURE.md §2 and 05 for signing.
appId: icu.opentac.app        # ← owner decides
productName: "OpenTac"
copyright: "OpenTac is an unofficial desktop app for God's Eye View © Bilawal Sidhu (MIT)."
directories:
  output: release
  buildResources: build
files:
  - dist/**
  - package.json
  - "!**/*.map"
  # Git Credential Manager (.NET) inside dugite's git tree is never invoked (no credential helpers configured); ~70 MB per arch.
  - "!node_modules/dugite/git/libexec/git-core/git-credential-manager*"
  - "!node_modules/dugite/git/libexec/git-core/*.dll"
  - "!node_modules/dugite/git/libexec/git-core/*.json"
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  # The app serves its UI over app:// and the engine over http://127.0.0.1; it never loads file://.
  grantFileProtocolExtraPrivileges: false
  resetAdHocDarwinSignature: true
asarUnpack:
  # dugite's git binaries cannot execute from inside the asar.
  - node_modules/dugite/git/**
extraResources:
  # Bundled Node 24 per arch (fetched by scripts/fetch-node.mjs into vendor/).
  - from: vendor/node/darwin-${arch}
    to: node
    # No node_modules-containing pattern here: electron-builder auto-adds '!**/node_modules/**' to any
    # filter mentioning node_modules, which silently dropped npm (Phase 0 validation). fetch-node.mjs already
    # prunes the tree to bin/, lib/node_modules/npm and LICENSE.
    filter: ["bin/**", "lib/**", "LICENSE"]
  - from: resources/launcher
    to: launcher
mac:
  category: public.app-category.utilities
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  icon: build/icon.icns
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: true          # APPLE_API_KEY must be a PATH to the .p8 file (+ APPLE_API_KEY_ID, APPLE_API_ISSUER); CI verifies with stapler/spctl because a missing credential only warns
  extendInfo:
    NSMicrophoneUsageDescription: "OpenTac uses the microphone for the voice feature of God's Eye View (hands-free voice control)."
    # Electron's template ships generic placeholders for these; OpenTac itself never uses them, they
    # only apply if a page in the engine asks the browser for the device.
    NSCameraUsageDescription: "OpenTac does not use the camera. macOS only asks if a page inside God's Eye View requests it."
    NSBluetoothAlwaysUsageDescription: "OpenTac does not use Bluetooth. macOS only asks if a page inside God's Eye View requests it."
    NSBluetoothPeripheralUsageDescription: "OpenTac does not use Bluetooth. macOS only asks if a page inside God's Eye View requests it."
    NSAudioCaptureUsageDescription: "OpenTac does not record system audio. macOS only asks if a page inside God's Eye View requests it."
    LSMinimumSystemVersion: "13.5"
  minimumSystemVersion: "13.5"   # Electron 45 needs macOS 13; the official Node 24 binaries need 13.5
dmg:
  sign: false
  contents:
    - { x: 130, y: 220 }
    - { x: 410, y: 220, type: link, path: /Applications }
publish:
  provider: github
  owner: gonzoinceng-ctrl
  repo: opentac-desktop   # the existing gonzoinceng-ctrl/opentac is an unrelated project (docs/DECISIONS.md)
  releaseType: draft
