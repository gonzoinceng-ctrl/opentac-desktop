# electron-builder configuration — see docs/brief/03-ARCHITECTURE.md §2 and 05 for signing.
appId: icu.opentac.app        # ← owner decides
productName: "OpenTac"
copyright: "OpenTac is an unofficial desktop app for God's Eye View © Bilawal Sidhu (MIT)."
directories:
  output: release
  buildResources: build
files:
  - dist/**
  - package.json
  - "!**/*.map"
asarUnpack:
  # dugite's git binaries cannot execute from inside the asar.
  - node_modules/dugite/git/**
extraResources:
  # Bundled Node 24 per arch (fetched by scripts/fetch-node.mjs into vendor/).
  - from: vendor/node/darwin-${arch}
    to: node
    filter: ["bin/node", "lib/node_modules/npm/**"]
  - from: resources/launcher
    to: launcher
mac:
  category: public.app-category.utilities
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  icon: build/icon.icns
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: true          # uses APPLE_API_KEY / APPLE_API_KEY_ID / APPLE_API_ISSUER from env
  extendInfo:
    NSMicrophoneUsageDescription: "OpenTac uses the microphone for hands-free voice control."
    LSMinimumSystemVersion: "12.0"
  minimumSystemVersion: "12.0"
dmg:
  sign: false
  contents:
    - { x: 130, y: 220 }
    - { x: 410, y: 220, type: link, path: /Applications }
publish:
  provider: github
  owner: OWNER            # ← wrapper repo owner
  repo: opentac       # ← wrapper repo name
  releaseType: draft
